name: tests

on:
  push:
  pull_request:
  workflow_dispatch:            # manual run from the Actions tab
    inputs:
      run_a11y:
        description: 'Run accessibility checks'
        type: boolean
        default: false
  schedule:
    - cron: '0 11 * * *'         # nightly cross-browser run (UTC)

jobs:
  all-tests:
    name: API + UI (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env:
          ORANGEHRM_USERNAME: ${{ secrets.ORANGEHRM_USERNAME }}
          ORANGEHRM_PASSWORD: ${{ secrets.ORANGEHRM_PASSWORD }}
          CI: 'true'
          RUN_A11Y: ${{ inputs.run_a11y == true && 'true' || 'false' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-chromium
          path: playwright-report/
          retention-days: 14

  cross-browser:
    name: UI (${{ matrix.browser }})
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { browser: chromium, grep: '.*' }
          - { browser: firefox,  grep: '@smoke' }
          - { browser: webkit,   grep: '@smoke' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npx playwright test --project=ui --grep "${{ matrix.grep }}"
        env:
          ORANGEHRM_USERNAME: ${{ secrets.ORANGEHRM_USERNAME }}
          ORANGEHRM_PASSWORD: ${{ secrets.ORANGEHRM_PASSWORD }}
          CI: 'true'
          BROWSER: ${{ matrix.browser }}
          RUN_A11Y: ${{ inputs.run_a11y == true && 'true' || 'false' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 14
